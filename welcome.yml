name: "Welcome First-Time Contributors"
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          issue-message: >
            Thanks for opening your first issue here 🎉 — really appreciate you
            contributing to hackathon-finds! A maintainer will take a look soon.
          pr-message: >
            Thanks for your first PR 🎉 — welcome to hackathon-finds! Someone will
            review this shortly. In the meantime, feel free to ⭐ the repo if it's
            been useful.
